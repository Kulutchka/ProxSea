; Each service runs in the foreground (no -D/daemonize flags) so
; supervisord can track its actual PID and restart it if it dies.
; This replaces the manual `service X start` / stale-PID cleanup that
; was needed constantly during interactive setup — supervisord owns
; that lifecycle instead.

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:clamd]
command=/usr/sbin/clamd --foreground=true
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:freshclam]
; Runs continuously in the background checking for signature updates,
; instead of only running once at container start.
command=/usr/bin/freshclam -d --foreground=true
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:c-icap]
; Uses a wrapper that blocks until clamd's socket exists instead of
; racing it — supervisord's start order/priority alone isn't a
; reliable guarantee that clamd is actually ready in time.
command=/usr/local/bin/wait-for-clamd.sh
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:squid]
; Squid runs with -N (no daemon), which sends its cache.log messages to
; stderr instead of the cache.log file. We tee stderr into the shared
; /var/log/squid/cache.log so the dashboard can show the operational log
; live, while still forwarding it to the container's stdout (docker logs).
; `exec` keeps supervisord tracking the real squid PID.
command=/bin/sh -c 'exec /usr/sbin/squid -N -Y -C 2>&1 | tee -a /var/log/squid/cache.log'
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:config-watcher]
; Watches for the dashboard's Apply-triggered signal file and runs
; squid -k reconfigure when it changes. Runs after squid (priority 40)
; since it needs Squid's binary/config to already be in place, though
; it will simply keep retrying if squid isn't up yet.
command=/usr/local/bin/watch-config.sh
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
